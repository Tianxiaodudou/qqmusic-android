name: 构建 APK

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 同一分支/标签的新一轮推送直接取消旧的一轮，避免重复占用 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        run: |
          set -eu
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="0.0.1"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本 $V"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 复用 Gradle 环境：依赖缓存 + 构建缓存 + 守护进程都在 runner 之间复用
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: false
          gradle-home-cache-cleanup: true

      # 固定签名：密钥以 base64 存在仓库 Secrets，每次构建还原同一份，
      # 新版本才能直接覆盖安装旧版本。
      - name: 还原签名密钥
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64，无法产出可覆盖安装的正式包" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/release.p12"
          keytool -list -v -keystore "$RUNNER_TEMP/signing/release.p12" -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E "Alias name|SHA256"

      # 只构建 release：不再产出 debug 变体（快一半），
      # 单元测试也跑在 release 变体上（testReleaseUnitTest），与出包共用一次编译。
      - name: 构建 release APK + 单元测试
        id: build
        continue-on-error: true
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}/signing/release.p12', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -o pipefail
          gradle --build-cache --stacktrace assembleRelease testReleaseUnitTest -PappVersion="$VERSION" 2>&1 | tee build.log

      - name: 构建失败时把错误写进注解
        if: steps.build.outcome == 'failure'
        working-directory: android
        run: |
          sed -n 's/.*<failure message="\([^"]*\)".*/::error::ASSERT \1/p' app/build/test-results/testReleaseUnitTest/*.xml 2>/dev/null | head -10
          grep -E "^e: |error:|FAILURE:|Caused by|Execution failed|FAILED" build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          tail -50 build.log
          exit 1

      - name: 校验签名与版本号
        run: |
          set -eu
          APK="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/aapt2" dump badging "$APK" | grep -q "versionName='${{ steps.ver.outputs.version }}'"
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "SHA-256"

      - name: 按「版本号-应用名」重命名
        id: apk
        run: |
          set -eu
          APK="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          OUT="${GITHUB_REF_NAME#v}-qqmusic-player.apk"
          if [[ ! "$GITHUB_REF_NAME" == v* ]]; then OUT="${{ steps.ver.outputs.version }}-qqmusic-player.apk"; fi
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"

      - name: 生成更新日志
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        run: |
          set -eu
          V="${{ steps.ver.outputs.version }}"
          OUT="$RUNNER_TEMP/release-notes.md"
          awk -v v="## v$V" 'index($0, v) == 1 {p=1; next} p && /^## /{exit} p{print}' CHANGELOG.md > "$OUT" || true
          if [ ! -s "$OUT" ]; then echo "本次更新说明待补充。" > "$OUT"; fi
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          head -5 "$OUT"

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QQ音乐播放器 ${{ steps.ver.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: false

      - name: 上传构建产物
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: qqmusic-player-${{ steps.ver.outputs.version }}
          path: ${{ steps.apk.outputs.path }}
